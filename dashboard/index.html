<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#18251e">
  <title>Chat Relay · Workspace</title>
  <link rel="stylesheet" href="/dashboard/styles.css">
  <link rel="stylesheet" href="/dashboard/shared-learn.css">
</head>
<body>
  <section id="loginView" class="auth-shell">
    <div class="auth-card">
      <div class="brand-row">
        <span class="brand-mark">CR</span>
        <div><strong>Chat Relay</strong><small>Operations workspace</small></div>
      </div>
      <div class="auth-copy">
        <h1>Welcome back.</h1>
        <p>Sign in to manage your workspace and review its activity.</p>
      </div>
      <p id="loginError" class="form-error" hidden role="alert"></p>
      <a class="button google" href="/admin/google/start">Continue with Google</a>
    </div>
  </section>

  <div id="appView" class="app-shell" hidden>
    <header class="sidebar">
      <div class="brand-row sidebar-brand">
        <span class="brand-mark">CR</span>
        <div><strong>Chat Relay</strong><small>WORKSPACE</small></div>
      </div>
      <nav id="nav" aria-label="Dashboard navigation"></nav>
      <div class="sidebar-footer">
        <span id="liveStatus" class="live-pill connecting" title="Connecting realtime updates">Connecting</span>
        <span id="roleBadge" class="role-badge"></span>
        <div class="account-identity"><span id="identityAvatar" class="identity-avatar" aria-hidden="true">CR</span><span id="who" class="identity"></span></div>
        <button id="refresh" class="icon-button" type="button" title="Refresh" aria-label="Refresh dashboard"></button>
        <button id="logout" class="button logout-button" type="button">Sign out</button>
      </div>
    </header>

    <main class="main">
      <header class="topbar">
        <div class="page-heading">
          <p id="eyebrow" class="eyebrow"></p>
          <h1 id="pageTitle"></h1>
          <p id="pageSubtitle" class="subtitle"></p>
        </div>
        <div class="top-actions">
          <span id="freshness" class="soft-pill">Waiting for data</span>
        </div>
      </header>
      <div id="notice" class="notice" hidden role="status"></div>
      <section id="content" aria-label="Dashboard content"></section>
    </main>
  </div>
  <script type="module" src="/dashboard/app.js"></script>
</body>
</html>
