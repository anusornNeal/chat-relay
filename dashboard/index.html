<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111417">
  <title>Chat Relay · Operations</title>
  <link rel="stylesheet" href="/dashboard/styles.css">
</head>
<body>
  <section id="loginView" class="auth-shell">
    <div class="auth-card">
      <div class="brand-row">
        <span class="brand-mark">CR</span>
        <div><strong>Chat Relay</strong><small>Operations dashboard</small></div>
      </div>
      <div class="auth-copy">
        <h1>Sign in</h1>
        <p>Use your Google account to access Chat Relay.</p>
      </div>
      <p id="loginError" class="form-error" hidden role="alert"></p>
      <a class="button google" href="/admin/google/start">Continue with Google</a>
    </div>
  </section>

  <div id="appView" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand-row sidebar-brand">
        <span class="brand-mark">CR</span>
        <div><strong>Chat Relay</strong><small>Operations</small></div>
      </div>
      <nav id="nav" aria-label="Dashboard"></nav>
      <div class="sidebar-footer">
        <span id="roleBadge" class="role-badge"></span>
        <small>Realtime updates</small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p id="eyebrow" class="eyebrow"></p>
          <h1 id="pageTitle"></h1>
          <p id="pageSubtitle" class="subtitle"></p>
        </div>
        <div class="top-actions">
          <span id="liveStatus" class="live-pill connecting" title="Connecting realtime updates">Connecting</span>
          <span id="freshness" class="soft-pill">Waiting for data</span>
          <span id="who" class="identity"></span>
          <button id="refresh" class="icon-button" type="button" title="Refresh" aria-label="Refresh dashboard"></button>
          <button id="logout" class="button" type="button">Sign out</button>
        </div>
      </header>
      <div id="notice" class="notice" hidden role="status"></div>
      <section id="content" aria-live="polite"></section>
    </main>
  </div>

  <script type="module" src="/dashboard/app.js"></script>
</body>
</html>
