name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-runtime:
    name: Package runtime Node 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=dev
      - run: node scripts/verify-publish.mjs
      - run: npm audit --omit=dev

  worker-verify:
    name: Worker and package Node 24
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run verify:publish

  integration:
    name: Device auth and zero-checkout
    runs-on: ubuntu-latest
    needs: [package-runtime, worker-verify]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Start local Worker
        shell: bash
        run: |
          npx wrangler dev --local --port 8796             --var AGENT_TOKEN:test-agent             --var CALLER_TOKEN:test-caller             --var ADMIN_TOKEN:test-admin             > /tmp/chat-relay-wrangler.log 2>&1 &
          echo $! > /tmp/chat-relay-wrangler.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8796/health >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/chat-relay-wrangler.log
          exit 1

      - name: Device auth smoke
        env:
          TEST_RELAY_URL: http://127.0.0.1:8796
        run: npm run test:device-auth

      - name: OAuth smoke
        env:
          TEST_RELAY_URL: http://127.0.0.1:8796
          TEST_ADMIN_TOKEN: test-admin
          TEST_CALLER_TOKEN: test-caller
        run: npm run test:oauth

      - name: Pack npm artifact
        id: pack
        shell: bash
        run: |
          mkdir -p /tmp/chat-relay-pack
          filename=$(npm pack --pack-destination /tmp/chat-relay-pack | tail -n 1)
          echo "tarball=/tmp/chat-relay-pack/$filename" >> "$GITHUB_OUTPUT"

      - name: Zero-checkout smoke
        env:
          TEST_RELAY_URL: http://127.0.0.1:8796
          CHAT_RELAY_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm run test:zero-checkout

      - name: Show Worker logs on failure
        if: failure()
        shell: bash
        run: cat /tmp/chat-relay-wrangler.log || true

      - name: Stop local Worker
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/chat-relay-wrangler.pid ]; then
            kill "$(cat /tmp/chat-relay-wrangler.pid)" 2>/dev/null || true
          fi
