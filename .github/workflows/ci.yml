name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-runtime:
    name: Package runtime Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run test:platform
      - run: node --test test/cli-tui.test.mjs test/config-security.test.mjs test/self-update.test.mjs test/agent-lifecycle-upgrade.test.mjs test/connection-generation.test.mjs test/usage-budget.test.mjs
      - run: npm run test:soak
      - run: node test/runner-ownership-smoke.mjs
      - run: node scripts/verify-publish.mjs
      - run: npm audit --omit=dev

  macos-runtime:
    name: macOS local-agent runtime
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:platform
      - run: npm run test:hardening
      - run: node test/runner-ownership-smoke.mjs
      - run: node scripts/verify-publish.mjs

  windows-runtime:
    name: Windows local-agent runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:platform
      - run: npm run test:hardening
      - run: node test/runner-ownership-smoke.mjs
      - run: node scripts/verify-publish.mjs

  worker-verify:
    name: Worker and package Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:hardening
      - run: npm run test:stability
      - run: npm run verify:publish

  integration:
    name: Public-review integration
    runs-on: ubuntu-latest
    needs: [package-runtime, macos-runtime, windows-runtime, worker-verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Start local Worker
        shell: bash
        run: |
          npx wrangler dev --local --port 8796 \
            --var AGENT_TOKEN:test-agent \
            --var CALLER_TOKEN:test-caller \
            --var ADMIN_TOKEN:test-admin \
            --var OPENAI_APPS_CHALLENGE:test-openai-apps-challenge \
            > /tmp/chat-relay-wrangler.log 2>&1 &
          echo $! > /tmp/chat-relay-wrangler.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8796/health >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/chat-relay-wrangler.log
          exit 1

      - name: Bootstrap CI agent
        env:
          RELAY_URL: http://127.0.0.1:8796
          ADMIN_TOKEN: test-admin
        run: node scripts/admin.mjs bootstrap default "CI Agent"

      - name: Start CI agent
        shell: bash
        env:
          RELAY_URL: http://127.0.0.1:8796
          AGENT_TOKEN: test-agent
          AGENT_ID: default
          AGENT_NAME: CI Agent
          TERMINAL_ENABLED: "0"
          ALLOWED_ROOTS: .
        run: |
          node agent/local-agent.mjs > /tmp/chat-relay-agent.log 2>&1 &
          echo $! > /tmp/chat-relay-agent.pid
          for i in {1..20}; do
            if grep -q "Agent connected" /tmp/chat-relay-agent.log; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/chat-relay-agent.log
          exit 1

      - name: Usage telemetry smoke
        env: &test-env
          TEST_RELAY_URL: http://127.0.0.1:8796
          TEST_ADMIN_TOKEN: test-admin
          TEST_CALLER_TOKEN: test-caller
        run: npm run test:usage

      - name: Quota smoke
        env: *test-env
        run: npm run test:quota

      - name: Admin API smoke
        env: *test-env
        run: npm run test:admin-api

      - name: Admin auth smoke
        env: *test-env
        run: npm run test:admin-auth

      - name: Dashboard smoke
        env: *test-env
        run: npm run test:dashboard

      - name: Device auth smoke
        env: *test-env
        run: npm run test:device-auth

      - name: OAuth smoke
        env: *test-env
        run: npm run test:oauth

      - name: Operations audit smoke
        env: *test-env
        run: npm run test:ops

      - name: Desktop contract smoke
        env: *test-env
        run: npm run test:desktop

      - name: Device management smoke
        env: *test-env
        run: npm run test:device-management

      - name: Submission readiness smoke
        env:
          TEST_RELAY_URL: http://127.0.0.1:8796
          TEST_ADMIN_TOKEN: test-admin
          TEST_CALLER_TOKEN: test-caller
          TEST_OPENAI_APPS_CHALLENGE: test-openai-apps-challenge
        run: npm run test:submission

      - name: Pack npm artifact
        id: pack
        shell: bash
        run: |
          mkdir -p /tmp/chat-relay-pack
          filename=$(npm pack --pack-destination /tmp/chat-relay-pack | tail -n 1)
          echo "tarball=/tmp/chat-relay-pack/$filename" >> "$GITHUB_OUTPUT"

      - name: Zero-checkout smoke
        env:
          TEST_RELAY_URL: http://127.0.0.1:8796
          CHAT_RELAY_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm run test:zero-checkout

      - name: Show integration logs on failure
        if: failure()
        shell: bash
        run: |
          cat /tmp/chat-relay-wrangler.log || true
          cat /tmp/chat-relay-agent.log || true

      - name: Stop local processes
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/chat-relay-agent.pid ]; then kill "$(cat /tmp/chat-relay-agent.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/chat-relay-wrangler.pid ]; then kill "$(cat /tmp/chat-relay-wrangler.pid)" 2>/dev/null || true; fi
